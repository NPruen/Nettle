<!DOCTYPE html>
<html>
<head>
    <title>Graph Visualization</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 1px solid #ccc;
            background-color: white;
        }
    </style>
</head>
<body>
    <canvas id="graphCanvas" width="900" height="900"></canvas>
    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        
        const graph = {"edges": [[0, 1], [0, 2], [0, 3], [0, 4], [1, 2], [1, 3], [1, 4], [2, 3], [2, 4], [3, 4]], "nodes": [0, 1, 2, 3, 4]};
        const positions = [[283.8741793435517, 850.0], [850.0, 280.7118531675511], [373.0384022468078, 753.4534560769988], [50.0, 255.17022343399654], [237.20435598958454, 50.0]];
        
        // Draw edges
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 1;
        for (let i = 0; i < graph.edges.length; i++) {
            const [u, v] = graph.edges[i];
            const [x1, y1] = positions[u];
            const [x2, y2] = positions[v];
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }
        
        // Draw vertices
        ctx.fillStyle = '#4CAF50';
        for (let i = 0; i < positions.length; i++) {
            const [x, y] = positions[i];
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw label
            ctx.fillStyle = '#000';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(i, x, y);
            ctx.fillStyle = '#4CAF50';
        }
    </script>
</body>
</html>
